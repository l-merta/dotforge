id: hyprland

name: Hyprland

description: Dynamic tiling Wayland compositor

category: compositor

platforms:
  - linux

protocols:
  - wayland

installation:
  arch:
    packages:
      - hyprland

dependencies:
  - xdg-desktop-portal
  - xdg-desktop-portal-hyprland

capabilities:
  - compositor
  - window-management
  - keybindings
  - workspaces
  - animations

configuration:
  directory: ~/.config/hypr

integration:
  themes: true
  wallpapers: true
  keybindings: true