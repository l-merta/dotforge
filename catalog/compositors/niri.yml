id: niri
name: Niri
description: Scrollable-tiling Wayland compositor
category: compositor

platforms: [linux]
protocols: [wayland]

installation:
  arch:
    packages: [niri]

dependencies: [xdg-desktop-portal-gnome]

capabilities: [compositor, window-management, keybindings, workspaces, animations]

configuration:
  directory: ~/.config/niri

integration:
  themes: true
  wallpapers: true
  keybindings: true
