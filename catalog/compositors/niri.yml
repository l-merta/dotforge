id: niri

name: Niri

description: Scrollable-tiling Wayland compositor

category: compositor

platforms:
  - linux

protocols:
  - wayland

installation:
  arch:
    packages:
      - niri

capabilities:
  - compositor
  - window-management
  - keybindings
  - workspaces

configuration:
  directory: ~/.config/niri

integration:
  themes: true
  wallpapers: true
  keybindings: true