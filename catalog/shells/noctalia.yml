id: noctalia
name: Noctalia
description: Wayland desktop shell providing panels, notifications, wallpaper management, and other desktop components
category: shell

platforms: [linux]
protocols: [wayland]

installation:
  arch:
    aur: [noctalia-shell]

capabilities: [panel, launcher, notifications, wallpaper, lockscreen, theme]

configuration:
  directory: ~/.config/noctalia

integration:
  themes: true
  wallpapers: true
  keybindings: true
